# NFT third-party binary provenance manifest.
#
# One entry per shipped binary "program" (a program may ship several platform
# variants: a POSIX-shell dispatcher plus .32/.64/.osx/.exe artifacts, or a set
# of MATLAB MEX files for different platforms). Every artifact currently
# committed to this repository must be covered by exactly one entry's
# `shipped_variants`/`sha256` map; `tools/check_provenance.py` enforces this by
# scanning file type (ELF/Mach-O/PE32/shell script), not a hardcoded list, so a
# newly added binary cannot silently ship without a provenance record.
#
# Schema per entry:
#   name:              short identifier, matches the primary shipped filename stem
#   role:               one-line description of what the tool/library does
#   shipped_variants:   every filename in this repo that is this same program
#                        (wrapper script + platform-specific artifacts)
#   sha256:              map of {variant_filename: sha256 of the artifact AS
#                        CURRENTLY COMMITTED}, computed directly against the
#                        working tree by this survey (2026-07-16)
#   upstream:            the original project/publisher
#   version:             upstream version identifier, or "unknown" with a
#                        one-line reason if it could not be determined
#   license:             SPDX identifier where one applies, or a plain-English
#                        description ("unknown", "no license", "proprietary")
#                        when no SPDX identifier fits -- "unknown" is a valid,
#                        honest value, not a placeholder to fill in later
#   license_evidence:    where the license determination comes from -- a
#                        specific file, header, upstream LICENSE fetch, "none
#                        found" with what was checked, an explicit "owner
#                        declaration" citation (ONLY for MATLAB/GUI toolbox
#                        files unambiguously NFT/SCCN's own authorship), or a
#                        "WORKING ASSUMPTION" citation tied to an open
#                        permission-request issue -- never a fabricated
#                        header. IMPORTANT HISTORY (quadmesh/lin2quad, all
#                        2026-07-16): an earlier pass briefly applied a broad
#                        "owner declaration" to quadmesh/lin2quad's
#                        unattributed files; the owner corrected this the same
#                        day (those files are presumed METU-authored, not
#                        SCCN's to license). A follow-up pass added stronger
#                        circumstantial authorship evidence but kept the
#                        conclusion "unknown, permission needed" (issue #51
#                        opened to seek that permission). The owner then made
#                        a final, distinct call: proceed on a documented
#                        WORKING ASSUMPTION of GPL-2.0-or-later for those two
#                        components while #51 is pending, to avoid blocking
#                        Phase 3 (#39) on a human round-trip -- see those
#                        entries and LICENSING.md. This is a posture choice,
#                        not a new authorship finding; treat "owner
#                        declaration" and "working assumption" as distinct,
#                        narrower mechanisms than a discovered header, each
#                        requiring its own evidenced (or explicitly presumed
#                        and flagged) basis -- neither extends to any
#                        unattributed binary by default
#   source_location:     where the source for the CURRENTLY SHIPPED binary can
#                        be found: a public upstream URL, "SCCN internal
#                        archive" (never a path or hostname -- that archive is
#                        not public), or "none located"
#   source_verified:     Does the ARCHIVED SOURCE actually reproduce the SHIPPED
#                        BINARY's behaviour? This is a SEPARATE, STRONGER claim than
#                        "the shipped binary matches a copy in the archive".
#                          no            - not attempted, or binary-matched only
#                          behaviour     - a rebuild was verified against a real baseline
#                          FAILED        - a rebuild was attempted and did NOT reproduce
#                        WHY THIS FIELD EXISTS: procmesh's provenance was believed settled
#                        because the shipped .osx is SHA256-identical to another COPY of
#                        the binary in the archive, and its debug strings name the build
#                        directory. Neither supports the conclusion. Building it proved the
#                        archived source is an OLDER snapshot missing the `prune` command
#                        NFT depends on (issue #57). binary==binary is NOT source==binary.
#   decision:            rebuild | vendor-upstream | recover-cli | replace | done | flag-for-removal;
#                        or "rebuild (provisional -- pending #NNN)" where the
#                        license itself is a working assumption of record
#                        pending an open permission-request issue, not yet a
#                        grant or a discovered header
#   notes:               anything else load-bearing (version splits across
#                        variants, embedded non-redistributable fragments, etc)

