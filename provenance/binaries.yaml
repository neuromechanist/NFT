# NFT third-party binary provenance manifest.
#
# One entry per shipped binary "program" (a program may ship several platform
# variants: a POSIX-shell dispatcher plus .32/.64/.osx/.exe artifacts, or a set
# of MATLAB MEX files for different platforms). Every artifact currently
# committed to this repository must be covered by exactly one entry's
# `shipped_variants`/`sha256` map; `tools/check_provenance.py` enforces this by
# scanning file type (ELF/Mach-O/PE32/shell script), not a hardcoded list, so a
# newly added binary cannot silently ship without a provenance record.
#
# Schema per entry:
#   name:              short identifier, matches the primary shipped filename stem
#   role:               one-line description of what the tool/library does
#   shipped_variants:   every filename in this repo that is this same program
#                        (wrapper script + platform-specific artifacts)
#   sha256:              map of {variant_filename: sha256 of the artifact AS
#                        CURRENTLY COMMITTED}, computed directly against the
#                        working tree by this survey (2026-07-16)
#   upstream:            the original project/publisher
#   version:             upstream version identifier, or "unknown" with a
#                        one-line reason if it could not be determined
#   license:             SPDX identifier where one applies, or a plain-English
#                        description ("unknown", "no license", "proprietary")
#                        when no SPDX identifier fits -- "unknown" is a valid,
#                        honest value, not a placeholder to fill in later
#   license_evidence:    where the license determination comes from -- a
#                        specific file, header, upstream LICENSE fetch, "none
#                        found" with what was checked, OR (for components that
#                        are NFT's own code but ship without a header) an
#                        explicit "owner declaration" citation -- never a
#                        fabricated header. Per owner ruling 2026-07-16: any
#                        component authored by Zeynep Akalin Acar / SCCN / the
#                        original NFT authors is GPL-2.0-or-later even where
#                        the shipped source carries no header of its own; this
#                        does NOT apply to genuinely third-party code NFT
#                        merely bundles, which keeps its own license
#   source_location:     where the source for the CURRENTLY SHIPPED binary can
#                        be found: a public upstream URL, "SCCN internal
#                        archive" (never a path or hostname -- that archive is
#                        not public), or "none located"
#   decision:            rebuild | vendor-upstream | recover-cli | replace | done | flag-for-removal
#   notes:               anything else load-bearing (version splits across
#                        variants, embedded non-redistributable fragments, etc)

