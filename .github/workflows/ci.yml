name: CI

# Continuous integration for NFT. Runs on GitHub-hosted Linux runners using
# MathWorks' matlab-actions, which are license-free for public repositories (no
# token or secret required). The runner has no NFT_test / NFT_DSL_DIR fixtures, so
# the fixture-gated regression tests (warping smoke, SCS/SBL inverse) skip cleanly;
# what CI verifies here is that the code loads/parses on Linux, the BEM/warping
# binary dispatch resolves to executable Linux binaries, and the test harness runs.
# The full real-data regression is meant for a fixture-provisioned runner (see
# tests/ and .context/plan.md).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matlab-tests:
    name: MATLAB test suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b

      - name: Run NFT test suite
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('tests');
            results = nft_run_tests;
            % No NFT_test / NFT_DSL_DIR fixtures on a cloud runner, so the
            % fixture-gated tests skip (Incomplete). Fail the job only on a real
            % test failure; nft_run_tests already prints a skip summary.
            nFailed = sum([results.Failed]);
            assert(nFailed == 0, '%d NFT test(s) failed on CI.', nFailed);
